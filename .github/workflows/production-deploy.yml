
name: Deploy production

on:
  push:
    branches:
      - production

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout production
        uses: actions/checkout@v4
        with:
          ref: production

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Deploy via rsync
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          APP_DIR="${DEPLOY_PATH:-/home/bansalla/public_html}"
          echo "Rsync target: $APP_DIR"
          rsync -avz \
            --exclude=".git" \
            --exclude=".github" \
            --exclude="node_modules" \
            -e "ssh -p $SSH_PORT" \
            ./ "$SSH_USER@$SSH_HOST:$APP_DIR"

          # Remove source files deleted from the repo. The full sync above does not
          # delete, so stale pages stay on the server and fail the Next.js type check.
          # Limit --delete to source trees so .env, .next, node_modules, and public uploads stay.
          for dir in app components lib; do
            rsync -avz --delete \
              -e "ssh -p $SSH_PORT" \
              "./$dir/" "$SSH_USER@$SSH_HOST:$APP_DIR/$dir/"
          done

      - name: Build and restart Next.js
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          APP_DIR="${DEPLOY_PATH:-/home/bansalla/public_html}"
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "bash -lc '
            set -e
            APP_DIR=\"$APP_DIR\"
            echo \"App directory: \$APP_DIR\"
            cd \"\$APP_DIR\"

            NODE_ROOT=/opt/nvm/versions/node
            if [ -x \"\$NODE_ROOT/v26.13.1/bin/npm\" ]; then
              NODE_BIN=\"\$NODE_ROOT/v26.13.1/bin\"
            elif [ -x \"\$NODE_ROOT/v24.21.0/bin/npm\" ]; then
              NODE_BIN=\"\$NODE_ROOT/v24.21.0/bin\"
            else
              NODE_BIN=\"\$(ls -1d \"\$NODE_ROOT\"/v* 2>/dev/null | sort -V | tail -1)/bin\"
            fi
            if [ ! -x \"\$NODE_BIN/npm\" ]; then
              echo \"No usable Node.js install under \$NODE_ROOT\" >&2
              ls -la \"\$NODE_ROOT\" >&2 || true
              exit 1
            fi
            export PATH=\"\$NODE_BIN:\$PATH\"
            echo \"Using Node from \$NODE_BIN (\$(node -v))\"

            if ! grep -q \"@tiptap/react\" components/admin/RichTextEditor.tsx; then
              echo \"RichTextEditor.tsx is missing TipTap import — source sync failed\" >&2
              exit 1
            fi
            echo \"TipTap source confirmed in RichTextEditor.tsx\"

            npm install

            echo \"Building Next.js application...\"
            ./node_modules/.bin/next build --webpack

            if ! grep -Rql \"ProseMirror\\|@tiptap\" .next/static; then
              echo \"TipTap/ProseMirror not found in client build output\" >&2
              exit 1
            fi
            echo \"TipTap confirmed in build output\"

            echo \"Restarting PM2 application...\"
            PM2_BIN=\"\"
            for candidate in \\
              /opt/nvm/versions/node/v14.15.3/bin/pm2 \\
              \"\$NODE_BIN/pm2\" \\
              \"\$(command -v pm2 || true)\" \\
              ./node_modules/.bin/pm2
            do
              if [ -n \"\$candidate\" ] && [ -x \"\$candidate\" ]; then
                PM2_BIN=\"\$candidate\"
                break
              fi
            done
            if [ -z \"\$PM2_BIN\" ]; then
              echo \"pm2 not found\" >&2
              exit 1
            fi
            echo \"Using pm2 from \$PM2_BIN\"
            \"\$PM2_BIN\" list || true

            # Live traffic is served by bansalla-next (not the older bansalla npm wrapper).
            \"\$PM2_BIN\" delete bansalla || true
            if \"\$PM2_BIN\" describe bansalla-next >/dev/null 2>&1; then
              echo \"Restarting bansalla-next\"
              \"\$PM2_BIN\" restart bansalla-next --update-env
              \"\$PM2_BIN\" show bansalla-next || true
            elif \"\$PM2_BIN\" describe bansalla >/dev/null 2>&1; then
              echo \"Restarting bansalla\"
              \"\$PM2_BIN\" restart bansalla --update-env
              \"\$PM2_BIN\" show bansalla || true
            else
              echo \"No known PM2 app found; starting bansalla-next\"
              \"\$PM2_BIN\" start ./node_modules/next/dist/bin/next --name bansalla-next --cwd \"\$APP_DIR\" -- start
              \"\$PM2_BIN\" save || true
              \"\$PM2_BIN\" show bansalla-next || true
            fi

            echo \"Deployment completed successfully.\"
          '"