
name: Deploy production

on:
  push:
    branches:
      - production

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout production
        uses: actions/checkout@v4
        with:
          ref: production

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Deploy via rsync
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          APP_DIR="${DEPLOY_PATH:-/home/bansalla/public_html}"
          echo "Rsync target: $APP_DIR"
          rsync -avz \
            --exclude=".git" \
            --exclude=".github" \
            --exclude="node_modules" \
            -e "ssh -p $SSH_PORT" \
            ./ "$SSH_USER@$SSH_HOST:$APP_DIR"

          # Remove source files deleted from the repo. The full sync above does not
          # delete, so stale pages stay on the server and fail the Next.js type check.
          # Limit --delete to source trees so .env, .next, node_modules, and public uploads stay.
          for dir in app components lib; do
            rsync -avz --delete \
              -e "ssh -p $SSH_PORT" \
              "./$dir/" "$SSH_USER@$SSH_HOST:$APP_DIR/$dir/"
          done

      - name: Run Deployment Commands
        run: |
          ssh -p ${{ secrets.SSH_PORT }} \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'

            shopt -s expand_aliases
            source ~/.bashrc

            cd ${{ secrets.DEPLOY_PATH }}

            npm11 install
            next24 build
            npm11 install pm2
            pm224 restart bansalla-next
          EOF
